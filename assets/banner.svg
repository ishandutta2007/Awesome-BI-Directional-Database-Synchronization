<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1b2a" />
      <stop offset="100%" stop-color="#1b263b" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="emeraldNeon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    <linearGradient id="glowLinear" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38ef7d" />
      <stop offset="50%" stop-color="#11998e" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>

    <!-- Filter for Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { opacity: 0.35; transform: scale(1); }
      50% { opacity: 0.65; transform: scale(1.05); }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-15px) translateX(10px); opacity: 0.7; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes dashStreamLeft {
      0% { stroke-dashoffset: 200; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes dashStreamRight {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 200; }
    }
    @keyframes rotateRing {
      0% { transform: rotate(0deg); transform-origin: 600px 70px; }
      100% { transform: rotate(360deg); transform-origin: 600px 70px; }
    }
    .grid-line { stroke: rgba(255, 255, 255, 0.04); stroke-width: 1; }
    .stream-line-1 {
      stroke: url(#cyanPurple);
      stroke-width: 3;
      stroke-dasharray: 12, 12;
      animation: dashStreamLeft 6s linear infinite;
    }
    .stream-line-2 {
      stroke: url(#glowLinear);
      stroke-width: 3;
      stroke-dasharray: 12, 12;
      animation: dashStreamRight 6s linear infinite;
    }
    .floating-dot {
      animation: floatParticle 5s ease-in-out infinite;
    }
    .halo {
      animation: pulseGlow 7s ease-in-out infinite;
    }
    .spin-ring {
      animation: rotateRing 20s linear infinite;
    }
    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 42px;
      fill: #ffffff;
      letter-spacing: -0.5px;
    }
    .subtitle-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 19px;
      fill: #94a3b8;
      letter-spacing: 0.2px;
    }
    .tag-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #38bdf8;
      letter-spacing: 0.8px;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGradient)" />

  <!-- Background Grid Pattern -->
  <g>
    <line x1="100" y1="0" x2="100" y2="360" class="grid-line" />
    <line x1="250" y1="0" x2="250" y2="360" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="360" class="grid-line" />
    <line x1="550" y1="0" x2="550" y2="360" class="grid-line" />
    <line x1="650" y1="0" x2="650" y2="360" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="360" class="grid-line" />
    <line x1="950" y1="0" x2="950" y2="360" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="360" class="grid-line" />
    <line x1="0" y1="60" x2="1200" y2="60" class="grid-line" />
    <line x1="0" y1="120" x2="1200" y2="120" class="grid-line" />
    <line x1="0" y1="180" x2="1200" y2="180" class="grid-line" />
    <line x1="0" y1="240" x2="1200" y2="240" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
  </g>

  <!-- Ambient Glow Circles (Deep background) -->
  <circle cx="200" cy="80" r="130" fill="#00f2fe" opacity="0.12" filter="url(#glow)" class="halo" />
  <circle cx="1000" cy="280" r="140" fill="#7b2cbf" opacity="0.15" filter="url(#glow)" class="halo" />
  <circle cx="600" cy="70" r="90" fill="#38ef7d" opacity="0.1" filter="url(#glow)" class="halo" />

  <!-- Animated Synchronous Data Streams (Curved Flow Lines) in lower background -->
  <path d="M 120 310 C 350 270, 450 330, 600 300 C 750 270, 850 330, 1080 300" fill="none" class="stream-line-1" />
  <path d="M 120 325 C 350 285, 450 345, 600 315 C 750 285, 850 345, 1080 315" fill="none" class="stream-line-2" />

  <!-- Floating Synced Nodes (Dynamic Particles) -->
  <circle cx="160" cy="140" r="4" fill="#00f5d4" class="floating-dot" />
  <circle cx="280" cy="70" r="5" fill="#38bdf8" class="floating-dot" style="animation-delay: 1.5s;" />
  <circle cx="920" cy="90" r="4.5" fill="#a78bfa" class="floating-dot" style="animation-delay: 2.2s;" />
  <circle cx="1040" cy="170" r="5" fill="#38ef7d" class="floating-dot" style="animation-delay: 0.8s;" />

  <!-- Central Dynamic Sync Wheel Graphic (Upper Area) -->
  <g class="spin-ring">
    <circle cx="600" cy="70" r="42" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-width="2" stroke-dasharray="10, 8" />
    <circle cx="600" cy="70" r="30" fill="none" stroke="rgba(56, 239, 125, 0.5)" stroke-width="2" stroke-dasharray="8, 6" />
    <circle cx="642" cy="70" r="5" fill="#00f2fe" filter="url(#glow)" />
    <circle cx="558" cy="70" r="5" fill="#38ef7d" filter="url(#glow)" />
  </g>
  <circle cx="600" cy="70" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <!-- Bi-Directional arrows icon in the wheel -->
  <path d="M 594 66 L 606 66 M 603 62 L 607 66 L 603 70" stroke="#38ef7d" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  <path d="M 606 74 L 594 74 M 597 70 L 593 74 L 597 78" stroke="#00f2fe" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" fill="none" />

  <!-- Pill Badge (Above Header) -->
  <g transform="translate(435, 125)">
    <rect width="330" height="30" rx="15" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2" />
    <circle cx="18" cy="15" r="4.5" fill="#10b981" />
    <text x="32" y="20" class="tag-text">REVERSE ETL • REAL-TIME CDC • REPLICATION</text>
  </g>

  <!-- Title & Subtitle (FOREGROUND - Crisp and Unobstructed) -->
  <!-- Header Title -->
  <text x="600" y="205" text-anchor="middle" class="title-text">
    Awesome Bi-Directional Database Sync
  </text>

  <!-- Subtitle -->
  <text x="600" y="248" text-anchor="middle" class="subtitle-text">
    Enterprise Reverse ETL, Master Data Management &amp; Open-Source Replication Pipelines
  </text>
</svg>
