<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 360"><defs><linearGradient id="bgGradient" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0d1b2a"/><stop offset="100%" stop-color="#1b263b"/></linearGradient><linearGradient id="cyanPurple" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="emeraldNeon" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f5d4"/><stop offset="100%" stop-color="#7b2cbf"/></linearGradient><linearGradient id="glowLinear" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38ef7d"/><stop offset="50%" stop-color="#11998e"/><stop offset="100%" stop-color="#00d2ff"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><style>@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.65;transform:scale(1.05)}}@keyframes floatParticle{0%{transform:translateY(0) translateX(0);opacity:.2}50%{transform:translateY(-15px) translateX(10px);opacity:.7}}@keyframes dashStreamLeft{0%{stroke-dashoffset:200}}@keyframes dashStreamRight{0%{stroke-dashoffset:0}}@keyframes rotateRing{0%{transform:rotate(0deg);transform-origin:600px 70px}}.grid-line{stroke:rgba(255,255,255,.04);stroke-width:1}.stream-line-1,.stream-line-2{stroke:url(#cyanPurple);stroke-width:3;stroke-dasharray:12,12;animation:dashStreamLeft 6s linear infinite}.stream-line-2{stroke:url(#glowLinear);animation:dashStreamRight 6s linear infinite}.floating-dot{animation:floatParticle 5s ease-in-out infinite}.halo{animation:pulseGlow 7s ease-in-out infinite}.spin-ring{animation:rotateRing 20s linear infinite}.subtitle-text,.tag-text,.title-text{font-family:-apple-system,BlinkMacSystemFont,&apos;Segoe UI&apos;,Roboto,Helvetica,Arial,sans-serif}.title-text{font-weight:800;font-size:42px;fill:#fff;letter-spacing:-.5px}.subtitle-text{font-weight:400;font-size:19px;fill:#94a3b8;letter-spacing:.2px}.tag-text{font-weight:600;font-size:13px;fill:#38bdf8;letter-spacing:.8px}</style><rect width="1200" height="360" fill="url(#bgGradient)" rx="16"/><g><line x1="100" x2="100" y1="0" y2="360" class="grid-line"/><line x1="250" x2="250" y1="0" y2="360" class="grid-line"/><line x1="400" x2="400" y1="0" y2="360" class="grid-line"/><line x1="550" x2="550" y1="0" y2="360" class="grid-line"/><line x1="650" x2="650" y1="0" y2="360" class="grid-line"/><line x1="800" x2="800" y1="0" y2="360" class="grid-line"/><line x1="950" x2="950" y1="0" y2="360" class="grid-line"/><line x1="1100" x2="1100" y1="0" y2="360" class="grid-line"/><line x1="0" x2="1200" y1="60" y2="60" class="grid-line"/><line x1="0" x2="1200" y1="120" y2="120" class="grid-line"/><line x1="0" x2="1200" y1="180" y2="180" class="grid-line"/><line x1="0" x2="1200" y1="240" y2="240" class="grid-line"/><line x1="0" x2="1200" y1="300" y2="300" class="grid-line"/></g><circle cx="200" cy="80" r="130" fill="#00f2fe" class="halo" filter="url(#glow)" opacity=".12"/><circle cx="1000" cy="280" r="140" fill="#7b2cbf" class="halo" filter="url(#glow)" opacity=".15"/><circle cx="600" cy="70" r="90" fill="#38ef7d" class="halo" filter="url(#glow)" opacity=".1"/><path fill="none" d="M 120 310 C 350 270, 450 330, 600 300 C 750 270, 850 330, 1080 300" class="stream-line-1"/><path fill="none" d="M 120 325 C 350 285, 450 345, 600 315 C 750 285, 850 345, 1080 315" class="stream-line-2"/><circle cx="160" cy="140" r="4" fill="#00f5d4" class="floating-dot"/><circle cx="280" cy="70" r="5" fill="#38bdf8" class="floating-dot" style="animation-delay:1.5s"/><circle cx="920" cy="90" r="4.5" fill="#a78bfa" class="floating-dot" style="animation-delay:2.2s"/><circle cx="1040" cy="170" r="5" fill="#38ef7d" class="floating-dot" style="animation-delay:.8s"/><g class="spin-ring"><circle cx="600" cy="70" r="42" fill="none" stroke="rgba(56, 189, 248, 0.4)" stroke-dasharray="10 8" stroke-width="2"/><circle cx="600" cy="70" r="30" fill="none" stroke="rgba(56, 239, 125, 0.5)" stroke-dasharray="8 6" stroke-width="2"/><circle cx="642" cy="70" r="5" fill="#00f2fe" filter="url(#glow)"/><circle cx="558" cy="70" r="5" fill="#38ef7d" filter="url(#glow)"/></g><circle cx="600" cy="70" r="18" fill="#1e293b" stroke="#38bdf8" stroke-width="2"/><path fill="none" stroke="#38ef7d" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M 594 66 L 606 66 M 603 62 L 607 66 L 603 70"/><path fill="none" stroke="#00f2fe" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2" d="M 606 74 L 594 74 M 597 70 L 593 74 L 597 78"/><g transform="translate(435, 125)"><rect width="330" height="30" fill="rgba(15, 23, 42, 0.75)" stroke="rgba(56, 189, 248, 0.45)" stroke-width="1.2" rx="15"/><circle cx="18" cy="15" r="4.5" fill="#10b981"/><text x="32" y="20" class="tag-text">REVERSE ETL • REAL-TIME CDC • REPLICATION</text></g><text x="600" y="205" class="title-text" text-anchor="middle">Awesome Bi-Directional Database Sync</text><text x="600" y="248" class="subtitle-text" text-anchor="middle">Enterprise Reverse ETL, Master Data Management &amp; Open-Source Replication Pipelines</text></svg>